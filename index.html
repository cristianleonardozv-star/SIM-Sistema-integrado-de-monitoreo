<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#23272B">
  <title>SIM: Sistema Integrado de Monitoreo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%23F2C230'/%3E%3Cpath d='M9 25a11 11 0 0 1 22 0z' fill='%2323272B'/%3E%3Crect x='7' y='25' width='26' height='3.5' rx='1.5' fill='%2323272B'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pagina-roles">
<main class="roles">
  <div class="roles-marca">
    <span id="logo-grande"></span>
    <div>
      <h1>SIM</h1>
      <p>Sistema Integrado de Monitoreo de atmósferas mineras</p>
    </div>
  </div>

  <section aria-labelledby="roles-t" class="roles-panel">
    <h2 id="roles-t">¿Con qué rol vas a ingresar?</h2>
    <p class="nota">Prototipo sin contraseña: elige tu rol para abrir sus pantallas. Puedes cambiarlo cuando quieras desde el encabezado.</p>
    <div class="tarjetas-rol">
      <button type="button" class="tarjeta-rol" data-rol="supervisor">
        <span class="figura" id="fig-supervisor"></span>
        <strong>Supervisor de personal</strong>
        <span class="nota">Control de ingreso con EPP, mineros dentro de la mina y su ubicación, registro y bloqueo de personal.</span>
      </button>
      <button type="button" class="tarjeta-rol" data-rol="ingeniero">
        <span class="figura" id="fig-ingeniero"></span>
        <strong>Ingeniero de minas</strong>
        <span class="nota">Monitoreo de la atmósfera, alertas, historial, mantenimiento de equipos y diseño de la mina.</span>
      </button>
    </div>
  </section>

  <div class="simbolos" aria-hidden="true">
    <span data-icono="pico" data-tam="28"></span>
    <span data-icono="casco" data-tam="28"></span>
    <span data-icono="vagoneta" data-tam="28"></span>
    <span data-icono="lampara" data-tam="28"></span>
    <span data-icono="castillete" data-tam="28"></span>
    <span data-icono="detector" data-tam="28"></span>
  </div>
  <p class="nota" style="text-align:center">Prototipo para hackatón con datos simulados.</p>
</main>

<script src="js/datos.js"></script>
<script src="js/iconos.js"></script>
<script src="js/rol.js"></script>
<script>
  (function () {
    const C = window.CANARIO;
    document.getElementById('logo-grande').innerHTML = C.logo(72);
    document.getElementById('fig-supervisor').innerHTML = C.figuraRol('supervisor');
    document.getElementById('fig-ingeniero').innerHTML = C.figuraRol('ingeniero');
    const actual = C.rol();
    document.querySelectorAll('.tarjeta-rol').forEach((b) => {
      if (b.dataset.rol === actual) b.classList.add('actual');
      b.addEventListener('click', () => {
        C.fijarRol(b.dataset.rol);
        location.href = C.ROLES[b.dataset.rol].inicio;
      });
    });
  })();
</script>
</body>
</html>
