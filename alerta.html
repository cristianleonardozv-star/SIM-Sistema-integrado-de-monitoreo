<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#23272B">
  <title>Alertas | SIM</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%23F2C230'/%3E%3Cpath d='M9 25a11 11 0 0 1 22 0z' fill='%2323272B'/%3E%3Crect x='7' y='25' width='26' height='3.5' rx='1.5' fill='%2323272B'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-pagina="alertas" data-roles="ingeniero,supervisor">
<header class="barra" id="barra"></header>

<main>
  <div class="fila" style="align-items:flex-start">
    <div class="ancho" style="display:flex;flex-direction:column;gap:20px;min-width:0">
      <div id="cabecera-alerta"></div>
      <div class="fila" id="cuerpo-alerta">
        <section class="panel" style="flex:1 1 300px" aria-labelledby="lt-t">
          <h2 id="lt-t">Cómo se llegó aquí</h2>
          <ol id="linea-tiempo" class="linea-tiempo"></ol>
        </section>
        <section class="panel" style="flex:1 1 300px" aria-labelledby="pz-t">
          <h2 id="pz-t">Personas en la zona</h2>
          <div id="personas"></div>
          <p class="nota">La ubicación de las cuadrillas se usa solo para seguridad, según la Ley 1581 de 2012.</p>
        </section>
      </div>
    </div>

    <div class="angosto" style="display:flex;flex-direction:column;gap:20px;min-width:0">
      <section class="panel confirmar" aria-labelledby="conf-t" id="panel-confirmar">
        <h2 id="conf-t">Confirmar la alerta</h2>
        <div id="zona-formulario"></div>
      </section>
      <section class="panel" aria-labelledby="otras-t">
        <h2 id="otras-t">Alertas abiertas</h2>
        <ul id="lista-alertas" class="lista-alertas"></ul>
      </section>
    </div>
  </div>
</main>

<script src="js/datos.js"></script>
<script src="js/iconos.js"></script>
<script src="js/rol.js"></script>
<script src="js/mina.js"></script>
<script src="js/personal.js"></script>
<script src="js/almacen.js"></script>
<script src="js/motor.js"></script>
<script src="js/simulador.js"></script>
<script src="js/mantenimiento.js"></script>
<script src="js/avisos.js"></script>
<script src="js/pagina-alerta.js"></script>
<script src="js/app.js"></script>
</body>
</html>
